# Despliegue en Render como sitio estático (Blueprint).
services:
  - type: web
    name: rc-flight-simulator
    runtime: static
    buildCommand: node tools/build.mjs
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
